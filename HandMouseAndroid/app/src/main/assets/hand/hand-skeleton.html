<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Hand Mouse Tracker Diagnostics</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    video{position:absolute;width:8px;height:8px;opacity:.02;pointer-events:none}
  </style>
</head>
<body>
<video id="videoInput" autoplay playsinline muted></video>
<script type="module">
import { HandLandmarker, FilesetResolver } from "./mediapipe/vision_bundle.mjs";

const video=document.getElementById('videoInput');
let handLandmarker;
let smoothX=.5,smoothY=.5;
let currentGesture='none';

const PINCH_ON=.32;
const PINCH_OFF=.42;
const SMOOTHING=.34;

let fpsFrames=0;
let fpsStart=performance.now();

function status(s){
  console.log("[HandMouse]",s);
  try{window.AndroidBridge?.onStatus(String(s));}catch(e){}
}
function fpsTick(){
  fpsFrames++;
  const now=performance.now();
  if(now-fpsStart>=1000){
    const fps=fpsFrames*1000/(now-fpsStart);
    try{window.AndroidBridge?.onFps(fps);}catch(e){}
    fpsFrames=0;
    fpsStart=now;
  }
}
function send(x,y,g){try{window.AndroidBridge?.onFrame(x,y,g);}catch(e){}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function handScale(lm){return Math.max(dist(lm[5],lm[17]),dist(lm[0],lm[9]),.05);}

window.addEventListener('error',e=>status('JS ERROR · '+(e.message||e.error||'unknown')));
window.addEventListener('unhandledrejection',e=>status('PROMISE ERROR · '+String(e.reason)));

function angleDeg(a,b,c){
  const ab={x:a.x-b.x,y:a.y-b.y,z:(a.z||0)-(b.z||0)};
  const cb={x:c.x-b.x,y:c.y-b.y,z:(c.z||0)-(b.z||0)};
  const d=ab.x*cb.x+ab.y*cb.y+ab.z*cb.z;
  const m=Math.hypot(ab.x,ab.y,ab.z)*Math.hypot(cb.x,cb.y,cb.z);
  if(m<1e-6)return 180;
  return Math.acos(Math.max(-1,Math.min(1,d/m)))*180/Math.PI;
}

function fingerBendScore(lm,mcp,pip,dip,tip){
  const pipAngle=angleDeg(lm[mcp],lm[pip],lm[dip]);
  const dipAngle=angleDeg(lm[pip],lm[dip],lm[tip]);
  const pipScore=Math.max(0,Math.min(1,(155-pipAngle)/55));
  const dipScore=Math.max(0,Math.min(1,(165-dipAngle)/60));
  return pipScore*.68+dipScore*.32;
}

function fistScore(lm){
  const scores=[
    fingerBendScore(lm,5,6,7,8),
    fingerBendScore(lm,9,10,11,12),
    fingerBendScore(lm,13,14,15,16),
    fingerBendScore(lm,17,18,19,20)
  ];
  const minScore=Math.min(...scores);
  const avgScore=scores.reduce((a,b)=>a+b,0)/scores.length;
  return Math.min(avgScore,minScore*1.08);
}

let fistLatched=false;
let fistReleaseFrames=0;
const FIST_ON=.72;
const FIST_OFF=.48;
const FIST_RELEASE_GRACE_FRAMES=5;

function isFullFist(lm){
  const score=fistScore(lm);
  if(!fistLatched){
    if(score>=FIST_ON){fistLatched=true;fistReleaseFrames=0;}
  }else{
    if(score<FIST_OFF){
      fistReleaseFrames++;
      if(fistReleaseFrames>=FIST_RELEASE_GRACE_FRAMES){fistLatched=false;fistReleaseFrames=0;}
    }else fistReleaseFrames=0;
  }
  return fistLatched;
}

function getGesture(lm){
  if(isFullFist(lm))return 'fist';
  const scale=handScale(lm);
  const ti=dist(lm[4],lm[8])/scale;
  const tm=dist(lm[4],lm[12])/scale;
  const threshold=currentGesture==='none'?PINCH_ON:PINCH_OFF;
  if(tm<threshold && ti>threshold*1.35)return 'right';
  if(ti<threshold)return 'left';
  return 'none';
}

function updateMouse(lm){
  const g=getGesture(lm);
  if(g==='fist'){
    currentGesture='fist';
    send(smoothX,smoothY,'fist');
    return;
  }
  const midX=(lm[4].x+lm[8].x)/2;
  const midY=(lm[4].y+lm[8].y)/2;
  const targetX=Math.max(0,Math.min(1,1-midX));
  const targetY=Math.max(0,Math.min(1,midY));
  smoothX+=(targetX-smoothX)*SMOOTHING;
  smoothY+=(targetY-smoothY)*SMOOTHING;
  currentGesture=g;
  send(smoothX,smoothY,g);
}

async function createLandmarker(delegate){
  status('WASM wird geladen…');
  const vision=await FilesetResolver.forVisionTasks('./mediapipe/wasm');
  status('WASM: OK · lade Hand-Modell…');
  const opts={
    baseOptions:{modelAssetPath:'./mediapipe/hand_landmarker.task'},
    runningMode:'VIDEO',
    numHands:1,
    minHandDetectionConfidence:.55,
    minHandPresenceConfidence:.55,
    minTrackingConfidence:.55
  };
  if(delegate)opts.baseOptions.delegate=delegate;
  return await HandLandmarker.createFromOptions(vision,opts);
}

async function init(){
  status('JS: OK · Initialisierung gestartet');

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    throw new Error('getUserMedia ist in diesem WebView nicht verfügbar');
  }

  try{
    status('MediaPipe GPU wird gestartet…');
    handLandmarker=await createLandmarker('GPU');
    status('MediaPipe: OK · GPU');
  }catch(e){
    status('GPU FEHLER · '+String(e)+' · versuche CPU…');
    handLandmarker=await createLandmarker(null);
    status('MediaPipe: OK · CPU fallback');
  }

  status('Kamera wird angefordert…');

  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:'user',
        width:{ideal:640},
        height:{ideal:480},
        frameRate:{ideal:30,max:30}
      },
      audio:false
    });
  }catch(e){
    status('KAMERA FEHLER · '+(e?.name||'Error')+' · '+(e?.message||String(e)));
    throw e;
  }

  status('Kamera-Stream erhalten · starte Video…');
  video.srcObject=stream;

  try{
    await video.play();
  }catch(e){
    status('VIDEO PLAY FEHLER · '+(e?.name||'Error')+' · '+(e?.message||String(e)));
    throw e;
  }

  const track=stream.getVideoTracks()[0];
  const settings=track?.getSettings?.()||{};
  status('Kamera: OK · '+(settings.width||'?')+'×'+(settings.height||'?')+' · '+(settings.frameRate||'?')+' FPS Quelle');

  requestAnimationFrame(processFrame);
}

function processFrame(now){
  fpsTick();

  if(video.readyState>=2 && handLandmarker){
    try{
      const result=handLandmarker.detectForVideo(video,now);
      if(result.landmarks.length) updateMouse(result.landmarks[0]);
      else {
        currentGesture='none';
        send(smoothX,smoothY,'none');
      }
    }catch(e){
      status('FRAME FEHLER · '+(e?.message||String(e)));
    }
  }

  requestAnimationFrame(processFrame);
}

init().catch(e=>{
  status('INIT FEHLER · '+(e?.name||'Error')+' · '+(e?.message||String(e)));
});
</script>
</body>
</html>
